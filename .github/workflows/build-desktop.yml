name: Build Cross-Platform Desktop Releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target_label: linux-x86_64
          - os: windows-latest
            target_label: windows-x64
          - os: macos-14
            target_label: macos-apple-silicon-m-series
          - os: macos-13
            target_label: macos-intel

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest -q

      - name: Package standalone desktop app
        run: python scripts/build_desktop.py

      - name: Upload desktop bundle
        uses: actions/upload-artifact@v4
        with:
          name: WattWise-${{ matrix.target_label }}
          path: dist/
